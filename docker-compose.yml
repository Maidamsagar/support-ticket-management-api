services:
  postgres:
    image: postgres:18
    container_name: ticketing-postgres

    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ticketing_password

    ports:
      - "55432:5432"

    volumes:
      - ticketing_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_user -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ticketing_postgres_data: